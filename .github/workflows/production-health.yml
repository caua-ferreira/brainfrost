name: Monitor produção

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica BrainFrost
        id: health
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 30 https://brainfrost.vercel.app/api/health

      - name: Abre ou atualiza alerta
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[alerta] Produção BrainFrost degradada';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-alert',
            });
            const existing = issues.find((issue) => issue.title === title);
            const body = `O health-check falhou em ${new Date().toISOString()}.\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (!existing) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['production-alert'] });
            }

      - name: Fecha alerta após recuperação
        if: steps.health.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[alerta] Produção BrainFrost degradada';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-alert',
            });
            for (const issue of issues.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Produção recuperada em ${new Date().toISOString()}.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }

