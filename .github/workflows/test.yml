name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Roda manualmente pela aba Actions se quiser.
  workflow_dispatch: {}

# Cancela runs pendentes do mesmo branch quando chega commit novo — evita fila
# empilhando quando alguém pusha 3 commits seguidos.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CLI é zero-dependência por decisão — não precisa npm install.
      - name: Rodar testes do CLI
        working-directory: brainfrost-cli
        run: npm test

  ui:
    name: UI (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sem package-lock committed (decisão do dono), então npm install em vez de npm ci.
      - name: Instalar deps da UI
        working-directory: brainfrost-ui
        run: npm install --no-audit --no-fund

      - name: Rodar testes da UI
        working-directory: brainfrost-ui
        run: npm test
