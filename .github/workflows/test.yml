name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancela runs pendentes do mesmo branch quando chega commit novo.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (CLI + UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install determinístico usando o package-lock.json da raiz do workspace.
      - name: Instalar dependências (workspace)
        run: npm ci

      # Script "test" da raiz roda `npm test` em todo workspace que tiver.
      - name: Rodar todos os testes
        run: npm test
